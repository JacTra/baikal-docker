services:
  baikal:
    image: local/baikal:latest
    build:
      context: .
      dockerfile: nginx-php8.2.dockerfile
      pull: true
      no_cache: true
    pull_policy: build
    restart: unless-stopped

    ports:
      - "9285:80"

    volumes:
      - type: bind
        source: /mnt/apps/baikal/config
        target: /var/www/baikal/config
        bind:
          create_host_path: false

      - type: bind
        source: /mnt/apps/baikal/Specific
        target: /var/www/baikal/Specific
        bind:
          create_host_path: false
